name: lote
on:
  push:
    paths: ['agendamento/lote-01-10/**', '.github/workflows/lote.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the packages for videos 01-10
        run: |
          for n in 01 02 03 04 05 06 07 08 09 10; do
            gh release download video$n -D /tmp/z/video$n -R "$GITHUB_REPOSITORY"
          done
          cp agendamento/lote-01-10/schedule-videos-01-10.xlsx /tmp/z/
          ls -la /tmp/z/*
      - name: One zip per video
        run: |
          cd /tmp/z
          for n in 01 02 03 04 05 06 07 08 09 10; do zip -0 -r /tmp/video$n.zip video$n; done
          ls -la /tmp/*.zip
      - name: Publish
        run: |
          gh release delete lote-01-10 -y --cleanup-tag || true
          gh release create lote-01-10 /tmp/video*.zip agendamento/lote-01-10/schedule-videos-01-10.xlsx \
            --target "$GITHUB_SHA" --title "Videos 01-10 for manual scheduling" \
            --notes "One zip per video (01-10) (long video, 5 Shorts, captions, thumbnail and textos.txt each) plus the posting schedule spreadsheet."

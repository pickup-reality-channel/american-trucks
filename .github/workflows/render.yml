name: render
on:
  workflow_dispatch:
    inputs:
      video:
        description: "folder name under videos/"
        required: true
        default: test30
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install piper-tts requests
          mkdir -p voices && cd voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -sSLO $B/en_US-ryan-high.onnx && curl -sSLO $B/en_US-ryan-high.onnx.json
      - name: Fetch real photos (Wikimedia Commons)
        run: python pipeline/fetch_media.py "${{ inputs.video }}"
      - name: Render
        run: python pipeline/build.py "${{ inputs.video }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}
          path: |
            videos/${{ inputs.video }}/out/${{ inputs.video }}.mp4
            videos/${{ inputs.video }}/out/captions.srt
            videos/${{ inputs.video }}/credits.json
      - name: Publish result to the deliveries branch
        run: |
          V="${{ inputs.video }}"
          mkdir -p /tmp/out && cp videos/$V/out/$V.mp4 videos/$V/out/captions.srt videos/$V/credits.json /tmp/out/
          git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git fetch origin deliveries || true
          git checkout -B deliveries $(git rev-parse --verify -q origin/deliveries || echo HEAD)
          mkdir -p deliveries/$V/media && cp /tmp/out/* deliveries/$V/ && cp videos/$V/media/*.jpg deliveries/$V/media/ 2>/dev/null || true
          git add -f deliveries && git commit -m "deliver $V" && git push origin deliveries
